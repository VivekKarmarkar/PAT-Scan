
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
#app { padding: 1.5rem 1rem; max-width: 900px; margin: 0 auto; }
h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.25rem; }
.subtitle { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
.scene-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.panel { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; }
.panel-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 0.75rem; font-weight: 500; letter-spacing: 0.03em; }
canvas { display: block; width: 100%; border-radius: 6px; }
.controls { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
button { padding: 8px 20px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 14px; cursor: pointer; font-family: var(--font-sans); }
button:hover { background: var(--color-background-secondary); }
button:disabled { opacity: 0.4; cursor: default; }
.clock { font-size: 28px; font-weight: 500; color: var(--color-text-primary); font-variant-numeric: tabular-nums; min-width: 60px; }
.phase-label { font-size: 13px; color: var(--color-text-secondary); }
.recon-panel { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 1.5rem; display: none; }
.recon-title { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 0.75rem; font-weight: 500; }
.progress-bar-bg { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 0.5rem; }
.progress-bar-fill { height: 100%; background: #1D9E75; border-radius: 4px; width: 0%; transition: width 0.1s linear; }
.progress-label { font-size: 12px; color: var(--color-text-secondary); }
</style>

<div id="app">
  <h2>PAT Scan — interactive demo</h2>
  <p class="subtitle">Left: phantom cross-section (ground truth) &nbsp;|&nbsp; Right: intact phantom with helical sensor sweep</p>

  <div class="scene-row">
    <div class="panel">
      <div class="panel-label">Ground truth — cut-open cross-section</div>
      <canvas id="c-truth" width="340" height="220"></canvas>
    </div>
    <div class="panel">
      <div class="panel-label">Intact phantom — sensor acquisition</div>
      <canvas id="c-scan" width="340" height="220"></canvas>
    </div>
  </div>

  <div class="controls">
    <button id="btn-start">Start scan</button>
    <div>
      <div class="clock" id="clock">0.0s</div>
      <div class="phase-label" id="phase">Ready</div>
    </div>
  </div>

  <div class="recon-panel" id="recon-panel">
    <div class="recon-title">Computer — reconstruction in progress</div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill"></div></div>
    <div class="progress-label" id="prog-label">0%</div>
    <canvas id="c-recon" width="340" height="220" style="margin-top:1rem; display:none; border-radius:6px;"></canvas>
  </div>
</div>

<script>
const SCAN_DURATION = 15000;
const RECON_DURATION = 5000;

const inclusions = [
  { cx: 0.38, cy: 0.42, rx: 0.10, ry: 0.08, color: '#3C3489', label: 'bone' },
  { cx: 0.62, cy: 0.38, rx: 0.07, ry: 0.07, color: '#3C3489', label: 'bone' },
  { cx: 0.50, cy: 0.60, rx: 0.08, ry: 0.05, color: '#0F6E56', label: 'tendon' },
  { cx: 0.30, cy: 0.62, rx: 0.06, ry: 0.06, color: '#993C1D', label: 'vessel' },
  { cx: 0.68, cy: 0.62, rx: 0.05, ry: 0.07, color: '#993C1D', label: 'vessel' },
  { cx: 0.50, cy: 0.35, rx: 0.05, ry: 0.04, color: '#854F0B', label: 'nerve' },
];

function drawCrossSection(canvas, alpha) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2, rx = W*0.42, ry = H*0.42;

  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  ctx.fillStyle = `rgba(250,236,231,${alpha})`;
  ctx.fill();
  ctx.strokeStyle = '#D85A30';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx, cy, rx*0.55, ry*0.55, 0, 0, Math.PI*2);
  ctx.fillStyle = `rgba(224,240,255,${alpha})`;
  ctx.fill();
  ctx.strokeStyle = '#85B7EB';
  ctx.lineWidth = 1;
  ctx.stroke();

  inclusions.forEach(inc => {
    ctx.beginPath();
    ctx.ellipse(cx + (inc.cx-0.5)*W*0.84, cy + (inc.cy-0.5)*H*0.84, inc.rx*W*0.84, inc.ry*H*0.84, 0, 0, Math.PI*2);
    const c = inc.color;
    ctx.fillStyle = alpha < 1 ? hexAlpha(c, alpha) : c;
    ctx.fill();
    if (alpha > 0.5) {
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(inc.label, cx + (inc.cx-0.5)*W*0.84, cy + (inc.cy-0.5)*H*0.84);
    }
  });

  ctx.strokeStyle = '#D85A30';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath();
  ctx.moveTo(cx - rx, cy - 8);
  ctx.lineTo(cx - rx - 18, cy - 8);
  ctx.moveTo(cx + rx, cy - 8);
  ctx.lineTo(cx + rx + 18, cy - 8);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#D85A30';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('cut', cx + rx + 4, cy - 4);
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawCylinder(canvas, sensorT, pressureMap) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const cx = W/2, top = 18, bottom = H - 18;
  const cylinderW = W * 0.52;
  const rx = cylinderW / 2;

  ctx.beginPath();
  ctx.rect(cx - rx, top, cylinderW, bottom - top);
  ctx.fillStyle = '#FAECE7';
  ctx.fill();
  ctx.strokeStyle = '#D85A30';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx, top, rx, 10, 0, 0, Math.PI*2);
  ctx.fillStyle = '#F5C4B3';
  ctx.fill();
  ctx.strokeStyle = '#D85A30';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx, bottom, rx, 10, 0, 0, Math.PI*2);
  ctx.fillStyle = '#FAECE7';
  ctx.fill();
  ctx.strokeStyle = '#D85A30';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (pressureMap && pressureMap.length > 0) {
    pressureMap.forEach(pt => {
      const px = cx + pt.x * rx;
      const py = pt.y;
      const r = Math.min(1, pt.p);
      const g = Math.max(0, 1 - pt.p);
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${Math.round(r*210+20)},${Math.round(g*100+30)},50,0.7)`;
      ctx.fill();
    });
  }

  const numTurns = 2.5;
  const helixPath = [];
  for (let i = 0; i <= 200; i++) {
    const frac = i / 200;
    const angle = frac * numTurns * Math.PI * 2;
    const xOff = Math.cos(angle) * 0.85;
    const y = top + 10 + frac * (bottom - top - 20);
    helixPath.push({ x: xOff, y });
  }

  ctx.beginPath();
  helixPath.forEach((pt, i) => {
    const px = cx + pt.x * rx * 0.72;
    if (i === 0) ctx.moveTo(px, pt.y);
    else ctx.lineTo(px, pt.y);
  });
  ctx.strokeStyle = 'rgba(52,52,137,0.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.stroke();
  ctx.setLineDash([]);

  if (sensorT !== null) {
    const frac = Math.min(sensorT, 1);
    const angle = frac * numTurns * Math.PI * 2;
    const xOff = Math.cos(angle) * 0.85;
    const sy = top + 10 + frac * (bottom - top - 20);
    const sx = cx + xOff * rx * 0.72;

    const sw = 44, sh = 22;
    ctx.fillStyle = '#2C2C2A';
    ctx.beginPath();
    ctx.roundRect(sx - sw/2, sy - sh/2, sw, sh, 4);
    ctx.fill();

    ctx.fillStyle = '#1D9E75';
    const pVal = 0.4 + 0.5 * Math.sin(frac * 30);
    ctx.fillRect(sx - sw/2 + 3, sy - sh/2 + 3, (sw - 6) * pVal, sh - 6);

    ctx.strokeStyle = '#5DCAA5';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.roundRect(sx - sw/2 + 3, sy - sh/2 + 3, sw - 6, sh - 6, 2);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SENSOR', sx, sy + 1);

    ctx.strokeStyle = '#5DCAA5';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx + sw/2, sy);
    ctx.lineTo(sx + sw/2 + 18, sy);
    ctx.stroke();
    ctx.fillStyle = 'var(--color-text-secondary)';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('IMU+pressure', sx + sw/2 + 4, sy - 3);
  }

  ctx.fillStyle = 'var(--color-text-secondary)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('forearm phantom', cx, H - 4);
}

const cTruth = document.getElementById('c-truth');
const cScan = document.getElementById('c-scan');
const cRecon = document.getElementById('c-recon');
const clockEl = document.getElementById('clock');
const phaseEl = document.getElementById('phase');
const btnStart = document.getElementById('btn-start');
const reconPanel = document.getElementById('recon-panel');
const progFill = document.getElementById('prog-fill');
const progLabel = document.getElementById('prog-label');

drawCrossSection(cTruth, 1);
drawCylinder(cScan, null, []);

let animFrame = null;
let pressureMap = [];
let scanStart = null;
let reconStart = null;
let phase = 'idle';

function tick(ts) {
  if (phase === 'scanning') {
    if (!scanStart) scanStart = ts;
    const elapsed = ts - scanStart;
    const frac = Math.min(elapsed / SCAN_DURATION, 1);
    clockEl.textContent = (elapsed / 1000).toFixed(1) + 's';
    phaseEl.textContent = 'Scanning...';

    const numTurns = 2.5;
    const top = 18, bottom = 220 - 18;
    const angle = frac * numTurns * Math.PI * 2;
    const xOff = Math.cos(angle) * 0.85;
    const sy = top + 10 + frac * (bottom - top - 20);

    if (Math.random() < 0.3) {
      pressureMap.push({ x: xOff * 0.72, y: sy, p: 0.3 + Math.random() * 0.7 });
      if (pressureMap.length > 120) pressureMap.shift();
    }

    drawCylinder(cScan, frac, pressureMap);

    if (frac >= 1) {
      phase = 'recon';
      reconStart = null;
      clockEl.textContent = '15.0s';
      phaseEl.textContent = 'Reconstructing...';
      reconPanel.style.display = 'block';
    }
  }

  if (phase === 'recon') {
    if (!reconStart) reconStart = ts;
    const elapsed = ts - reconStart;
    const frac = Math.min(elapsed / RECON_DURATION, 1);
    const pct = Math.round(frac * 100);
    progFill.style.width = pct + '%';
    progLabel.textContent = pct + '%';

    if (frac >= 1) {
      phase = 'done';
      phaseEl.textContent = 'Done';
      cRecon.style.display = 'block';
      drawCrossSection(cRecon, 1);
      progLabel.textContent = 'Reconstruction complete';
      btnStart.disabled = false;
      btnStart.textContent = 'Reset';
      animFrame = null;
      return;
    }
    drawCrossSection(cRecon, frac);
    cRecon.style.display = 'block';
  }

  animFrame = requestAnimationFrame(tick);
}

btnStart.addEventListener('click', () => {
  if (phase === 'done') {
    phase = 'idle';
    scanStart = null;
    reconStart = null;
    pressureMap = [];
    clockEl.textContent = '0.0s';
    phaseEl.textContent = 'Ready';
    reconPanel.style.display = 'none';
    cRecon.style.display = 'none';
    progFill.style.width = '0%';
    progLabel.textContent = '0%';
    drawCylinder(cScan, null, []);
    btnStart.textContent = 'Start scan';
    btnStart.disabled = false;
    return;
  }
  phase = 'scanning';
  scanStart = null;
  btnStart.disabled = true;
  animFrame = requestAnimationFrame(tick);
});
</script>
